apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: blogapp
resources:
  - namespace.yaml
  - storage.yaml
  - ../database
  - mysql.yaml
  - backend.yaml
  - frontend.yaml
  - availability.yaml
  - network-policies.yaml
images:
  - name: blogapp-backend
    newName: example.invalid/blogapp-backend
    newTag: configure-before-deploy
  - name: blogapp-frontend
    newName: example.invalid/blogapp-frontend
    newTag: configure-before-deploy
